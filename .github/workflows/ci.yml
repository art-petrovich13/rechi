name: CI

on:
  push:
    branches: [main, art/flutter]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: rechi_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d rechi_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/rechi_test
      BOT_TOKEN: "123456:ci-token"
      JWT_SECRET: ci-secret-at-least-thirty-two-bytes-long
      RECHI_INTEGRATION: "1"
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - run: alembic upgrade head
      - run: alembic check
      - run: python -m unittest discover -s tests -t . -v

  mini_app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mini_app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.6"
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
